<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#020308">
<title>WILDAN WILD RACE V2.0</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif
}

body{touch-action:none}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block
}

/* ================= MENU ================= */

#boot,
#menu,
#result{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:#fff
}

#boot{
  background:
    radial-gradient(circle at center,#18283c 0,#05070b 45%,#000 100%);
  transition:opacity .7s
}

.bootLogo{
  font-size:clamp(45px,11vw,120px);
  font-weight:1000;
  font-style:italic;
  letter-spacing:-7px;
  text-shadow:
    0 0 10px #00eaff,
    0 0 30px #007cff,
    7px 7px 0 #073e91
}

.bootSub{
  margin-top:8px;
  color:#00eaff;
  letter-spacing:9px;
  font-weight:900
}

.bootBar{
  margin-top:35px;
  width:min(340px,70vw);
  height:5px;
  background:#222;
  overflow:hidden
}

.bootBar i{
  display:block;
  height:100%;
  width:0;
  background:linear-gradient(90deg,#006cff,#00eaff,#fff);
  animation:boot 1.8s forwards
}

@keyframes boot{
  to{width:100%}
}

#menu{
  display:none;
  overflow:hidden;
  background:
    linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.82)),
    radial-gradient(circle at 50% 35%,#164260,#050910 55%,#000)
}

.menuGrid{
  position:absolute;
  inset:0;
  opacity:.35;
  background:
    linear-gradient(rgba(0,234,255,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,234,255,.08) 1px,transparent 1px);
  background-size:55px 55px;
  transform:perspective(500px) rotateX(60deg) scale(1.8);
  transform-origin:center bottom
}

.menuContent{
  position:relative;
  z-index:2;
  width:min(700px,92vw);
  text-align:center
}

.menuBrand{
  font-size:clamp(50px,11vw,120px);
  line-height:.8;
  font-weight:1000;
  font-style:italic;
  letter-spacing:-7px;
  text-shadow:
    0 0 12px #00eaff,
    0 0 45px #007cff,
    9px 9px 0 #073f9c
}

.menuRace{
  margin-top:13px;
  font-size:clamp(17px,3vw,28px);
  letter-spacing:10px;
  font-weight:1000;
  color:#fff
}

.menuLine{
  width:min(500px,80vw);
  height:2px;
  margin:25px auto;
  background:linear-gradient(90deg,transparent,#00eaff,transparent);
  box-shadow:0 0 12px #00eaff
}

.menuBtn{
  display:block;
  width:min(360px,78vw);
  margin:10px auto;
  padding:17px 20px;
  border:1px solid #00eaff;
  background:rgba(0,15,25,.75);
  color:#fff;
  font-size:17px;
  font-weight:1000;
  letter-spacing:3px;
  cursor:pointer;
  clip-path:polygon(0 0,94% 0,100% 50%,94% 100%,0 100%,5% 50%);
  box-shadow:
    inset 0 0 20px rgba(0,234,255,.08),
    0 0 14px rgba(0,234,255,.18);
  transition:.15s
}

.menuBtn:hover,
.menuBtn:active{
  color:#001018;
  background:#00eaff;
  transform:scale(1.04);
  box-shadow:0 0 25px #00eaff
}

.menuInfo{
  margin-top:22px;
  color:#7895a5;
  font-size:10px;
  letter-spacing:4px
}

.menuVersion{
  position:absolute;
  bottom:15px;
  font-size:10px;
  letter-spacing:4px;
  color:#52606a
}

/* ================= HUD ================= */

#hud{
  position:fixed;
  inset:0;
  z-index:20;
  display:none;
  pointer-events:none;
  color:#fff
}

#brandHud{
  position:absolute;
  top:16px;
  left:18px;
  color:#00eaff;
  font-size:11px;
  font-weight:1000;
  letter-spacing:4px;
  text-shadow:0 2px 5px #000
}

#positionBox{
  position:absolute;
  left:18px;
  top:38px;
  font-size:clamp(34px,6vw,65px);
  font-weight:1000;
  font-style:italic;
  text-shadow:0 3px 7px #000
}

#positionBox small{
  color:#00eaff;
  font-size:13px
}

#speedBox{
  position:absolute;
  right:18px;
  top:12px;
  text-align:right;
  font-style:italic;
  text-shadow:0 3px 7px #000
}

#speed{
  font-size:clamp(43px,8vw,85px);
  font-weight:1000;
  line-height:.9
}

#speedUnit{
  color:#00eaff;
  font-size:11px;
  letter-spacing:4px;
  font-weight:1000
}

#lap{
  margin-top:7px;
  font-size:13px;
  font-weight:1000;
  letter-spacing:3px
}

#raceTime{
  margin-top:4px;
  font-size:11px;
  color:#9fb2be
}

#nitro{
  position:absolute;
  left:50%;
  bottom:28px;
  transform:translateX(-50%);
  width:min(380px,45vw)
}

#nitroTitle{
  text-align:center;
  font-size:10px;
  letter-spacing:5px;
  font-weight:1000;
  margin-bottom:5px
}

#nitroTrack{
  height:10px;
  border:1px solid #fff;
  background:rgba(0,0,0,.7);
  box-shadow:0 0 15px rgba(0,234,255,.3)
}

#nitroFill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#006dff,#00eaff,#fff);
  box-shadow:0 0 15px #00eaff
}

/* ================= CONTROLS ================= */

#controls{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  pointer-events:none
}

.ctrl{
  position:absolute;
  width:67px;
  height:67px;
  border:1px solid rgba(255,255,255,.55);
  border-radius:50%;
  background:rgba(0,0,0,.3);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:1000;
  pointer-events:auto;
  backdrop-filter:blur(4px)
}

.ctrl:active{
  background:rgba(0,234,255,.4);
  border-color:#00eaff;
  box-shadow:0 0 18px #00eaff
}

#left{left:18px;bottom:25px}
#right{left:98px;bottom:25px}
#brake{right:98px;bottom:25px}
#gas{right:18px;bottom:25px}

#nitroBtn{
  right:18px;
  bottom:104px;
  width:76px;
  height:76px;
  font-size:11px;
  letter-spacing:1px;
  color:#00eaff;
  border-color:#00eaff
}

#pauseBtn{
  position:absolute;
  top:83px;
  right:18px;
  width:43px;
  height:43px;
  border:1px solid #fff;
  border-radius:4px;
  background:rgba(0,0,0,.35);
  color:#fff;
  pointer-events:auto;
  font-weight:1000
}

/* ================= COUNTDOWN ================= */

#countdown{
  position:fixed;
  inset:0;
  z-index:40;
  display:none;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  color:#fff;
  font-size:clamp(90px,24vw,250px);
  font-weight:1000;
  font-style:italic;
  text-shadow:
    0 0 15px #00eaff,
    0 0 55px #007cff
}

/* ================= RESULT ================= */

#result{
  display:none;
  background:rgba(0,0,0,.82);
  text-align:center
}

.resultSmall{
  color:#00eaff;
  letter-spacing:5px;
  font-weight:1000
}

.resultTitle{
  margin:10px 0;
  font-size:clamp(50px,12vw,125px);
  font-weight:1000;
  font-style:italic;
  text-shadow:0 0 30px #00eaff
}

.resultStats{
  line-height:2;
  color:#cbd7dc;
  font-size:17px
}

@media(max-width:700px){
  #nitro{
    bottom:108px;
    width:190px
  }

  #brandHud{
    left:10px;
    top:9px;
    font-size:8px
  }

  #positionBox{
    left:10px;
    top:30px;
    font-size:29px
  }

  #speedBox{
    right:10px;
    top:8px
  }

  #speed{
    font-size:38px
  }

  #lap{
    font-size:10px
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="boot">
  <div class="bootLogo">WILDAN</div>
  <div class="bootSub">WILD RACE</div>
  <div class="bootBar"><i></i></div>
</div>

<div id="menu">
  <div class="menuGrid"></div>

  <div class="menuContent">
    <div class="menuBrand">WILDAN</div>
    <div class="menuRace">WILD RACE</div>
    <div class="menuLine"></div>

    <button class="menuBtn" id="start">
      ▶ START RACE
    </button>

    <button class="menuBtn" id="controlsHelp">
      🎮 CONTROLS
    </button>

    <div class="menuInfo">
      ARCADE STREET RACING • NIGHT DRIVE
    </div>
  </div>

  <div class="menuVersion">
    WILDAN WILD RACE V2.0
  </div>
</div>

<div id="hud">
  <div id="brandHud">WILDAN WILD RACE // STREET RACING</div>

  <div id="positionBox">
    <span id="position">1</span>
    <small>/ 6</small>
  </div>

  <div id="speedBox">
    <div id="speed">0</div>
    <div id="speedUnit">KM/H</div>
    <div id="lap">LAP 1 / 3</div>
    <div id="raceTime">00:00</div>
  </div>

  <div id="nitro">
    <div id="nitroTitle">NITRO BOOST</div>
    <div id="nitroTrack">
      <div id="nitroFill"></div>
    </div>
  </div>
</div>

<div id="controls">
  <button class="ctrl" id="left">◀</button>
  <button class="ctrl" id="right">▶</button>
  <button class="ctrl" id="brake">▼</button>
  <button class="ctrl" id="gas">▲</button>
  <button class="ctrl" id="nitroBtn">NITRO</button>
  <button id="pauseBtn">Ⅱ</button>
</div>

<div id="countdown"></div>

<div id="result">
  <div class="resultSmall">RACE COMPLETE</div>
  <div class="resultTitle" id="resultTitle">FINISH</div>
  <div class="resultStats" id="resultStats"></div>

  <button class="menuBtn" id="again">
    🔄 RACE AGAIN
  </button>

  <button class="menuBtn" id="backMenu">
    ⌂ MAIN MENU
  </button>
</div>

<script>
"use strict";

/* =====================================================
   WILDAN WILD RACE V2.0
   PS2-INSPIRED ARCADE RACING
   SINGLE FILE ENGINE
===================================================== */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let DPR=Math.min(devicePixelRatio||1,2);

function resize(){
  W=innerWidth;
  H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,2);

  canvas.width=W*DPR;
  canvas.height=H*DPR;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();

/* ================= STATE ================= */

const game={
  running:false,
  paused:false,
  finished:false,

  speed:0,
  maxSpeed:285,

  x:0,
  distance:0,

  lap:1,
  laps:3,

  nitro:100,
  boosting:false,

  startTime:0,
  elapsed:0,

  cameraShake:0,
  roadPhase:0
};

const keys={
  left:false,
  right:false,
  gas:false,
  brake:false,
  nitro:false
};

const cars=[
  {
    player:true,
    name:"WILDAN",
    x:0,
    z:0,
    speed:0,
    color:"#00eaff"
  },
  {
    name:"RIVAL 01",
    x:-.42,
    z:180,
    speed:220,
    color:"#ff1648"
  },
  {
    name:"RIVAL 02",
    x:.38,
    z:390,
    speed:211,
    color:"#ffc400"
  },
  {
    name:"RIVAL 03",
    x:-.18,
    z:620,
    speed:228,
    color:"#8e5cff"
  },
  {
    name:"RIVAL 04",
    x:.45,
    z:850,
    speed:216,
    color:"#35ed75"
  },
  {
    name:"RIVAL 05",
    x:-.50,
    z:1080,
    speed:224,
    color:"#ff7618"
  }
];

/* ================= INPUT ================= */

addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();

  if(k==="a"||k==="arrowleft"){
    keys.left=true;
    e.preventDefault();
  }

  if(k==="d"||k==="arrowright"){
    keys.right=true;
    e.preventDefault();
  }

  if(k==="w"||k==="arrowup"){
    keys.gas=true;
    e.preventDefault();
  }

  if(k==="s"||k==="arrowdown"){
    keys.brake=true;
    e.preventDefault();
  }

  if(k===" "){
    keys.nitro=true;
    e.preventDefault();
  }

  if(k==="p"||k==="escape"){
    pause();
  }
});

addEventListener("keyup",e=>{
  const k=e.key.toLowerCase();

  if(k==="a"||k==="arrowleft")keys.left=false;
  if(k==="d"||k==="arrowright")keys.right=false;
  if(k==="w"||k==="arrowup")keys.gas=false;
  if(k==="s"||k==="arrowdown")keys.brake=false;
  if(k===" ")keys.nitro=false;
});

/* mobile */

function hold(id,key){
  const el=document.getElementById(id);

  const on=e=>{
    e.preventDefault();
    keys[key]=true
  };

  const off=e=>{
    e.preventDefault();
    keys[key]=false
  };

  el.addEventListener("pointerdown",on);
  el.addEventListener("pointerup",off);
  el.addEventListener("pointercancel",off);
  el.addEventListener("pointerleave",off);
}

hold("left","left");
hold("right","right");
hold("gas","gas");
hold("brake","brake");
hold("nitroBtn","nitro");

/* ================= MENU ================= */

document.getElementById("start").onclick=startRace;

document.getElementById("controlsHelp").onclick=()=>{
  alert(
`WILDAN WILD RACE V2.0

PC / LAPTOP

W / ↑  = GAS
S / ↓  = REM
A / ←  = KIRI
D / →  = KANAN
SPACE  = NITRO
P / ESC = PAUSE

MOBILE

Gunakan tombol layar.

Tujuan:
Selesaikan 3 lap dan kalahkan rival.`
  );
};

document.getElementById("again").onclick=startRace;

document.getElementById("backMenu").onclick=()=>{
  document.getElementById("result").style.display="none";
  document.getElementById("hud").style.display="none";
  document.getElementById("controls").style.display="none";
  document.getElementById("menu").style.display="flex";
};

/* ================= START ================= */

function startRace(){

  document.getElementById("menu").style.display="none";
  document.getElementById("result").style.display="none";

  document.getElementById("hud").style.display="block";
  document.getElementById("controls").style.display="block";

  game.running=false;
  game.paused=false;
  game.finished=false;

  game.speed=0;
  game.x=0;
  game.distance=0;
  game.lap=1;
  game.nitro=100;
  game.boosting=false;
  game.elapsed=0;
  game.cameraShake=0;

  cars[0].z=0;

  cars[1].z=180;
  cars[2].z=390;
  cars[3].z=620;
  cars[4].z=850;
  cars[5].z=1080;

  game.startTime=performance.now();

  countdown();
}

function countdown(){

  const el=document.getElementById("countdown");

  el.style.display="flex";

  const values=["3","2","1","GO!"];
  let i=0;

  el.textContent=values[0];

  const t=setInterval(()=>{

    i++;

    if(i>=values.length){
      clearInterval(t);
      el.style.display="none";
      game.running=true;
      game.last=performance.now();
      return;
    }

    el.textContent=values[i];

  },700);
}

/* ================= PAUSE ================= */

document.getElementById("pauseBtn").onclick=pause;

function pause(){

  if(!game.running||game.finished)return;

  game.paused=!game.paused;

  document.getElementById("pauseBtn").textContent=
    game.paused?"▶":"Ⅱ";
}

/* ================= UPDATE ================= */

function update(dt){

  if(!game.running||game.paused||game.finished)return;

  /* acceleration */

  if(keys.gas){
    game.speed+=180*dt;
  }else{
    game.speed-=38*dt;
  }

  if(keys.brake){
    game.speed-=260*dt;
  }

  game.speed=Math.max(0,game.speed);
  game.speed=Math.min(game.maxSpeed,game.speed);

  /* nitro */

  game.boosting=false;

  if(
    keys.nitro &&
    game.nitro>0 &&
    game.speed>60
  ){

    game.boosting=true;

    game.speed+=280*dt;
    game.nitro-=35*dt;

    if(game.nitro<0)game.nitro=0;

  }else{

    game.nitro+=4.8*dt;

    if(game.nitro>100)game.nitro=100;
  }

  /* steering */

  let steer=.68+game.speed/360;

  if(keys.left)game.x-=steer*dt;
  if(keys.right)game.x+=steer*dt;

  game.x*=.995;

  game.x=Math.max(-1.05,Math.min(1.05,game.x));

  /* speed camera */

  if(game.speed>210){
    game.cameraShake=
      Math.min(
        7,
        (game.speed-210)/12
      );
  }else{
    game.cameraShake*=.92;
  }

  /* movement */

  game.distance+=
    game.speed*dt*.58;

  game.roadPhase+=
    game.speed*dt*.002;

  const lapLength=3500;

  game.lap=
    Math.floor(game.distance/lapLength)+1;

  if(game.lap>game.laps){
    finish();
    return;
  }

  /* rivals */

  const total=game.laps*lapLength;

  for(let i=1;i<cars.length;i++){

    cars[i].z+=cars[i].speed*dt*.58;

    if(cars[i].z>total+500){
      cars[i].z-=total;
    }
  }

  game.elapsed=
    (performance.now()-game.startTime)/1000;

  updateHUD();
}

/* ================= HUD ================= */

function updateHUD(){

  document.getElementById("speed").textContent=
    Math.round(game.speed);

  document.getElementById("lap").textContent=
    "LAP "+Math.min(game.lap,game.laps)+" / "+game.laps;

  document.getElementById("raceTime").textContent=
    timeFormat(game.elapsed);

  document.getElementById("nitroFill").style.width=
    game.nitro+"%";

  cars[0].z=game.distance;

  const sorted=[...cars].sort((a,b)=>b.z-a.z);

  let pos=sorted.indexOf(cars[0])+1;

  document.getElementById("position").textContent=pos;
}

function timeFormat(t){

  const m=Math.floor(t/60);
  const s=Math.floor(t%60);

  return String(m).padStart(2,"0")+":"+
         String(s).padStart(2,"0");
}

/* ================= FINISH ================= */

function finish(){

  game.finished=true;
  game.running=false;

  cars[0].z=game.distance;

  const sorted=[...cars].sort((a,b)=>b.z-a.z);
  const pos=sorted.indexOf(cars[0])+1;

  setTimeout(()=>{

    document.getElementById("hud").style.display="none";
    document.getElementById("controls").style.display="none";

    document.getElementById("resultTitle").textContent=
      pos===1?"YOU WIN!":"FINISH";

    document.getElementById("resultStats").innerHTML=
      "POSITION <b>"+pos+" / "+cars.length+
      "</b><br>"+
      "TIME <b>"+timeFormat(game.elapsed)+"</b><br>"+
      "LAPS <b>"+game.laps+"</b>";

    document.getElementById("result").style.display="flex";

  },500);
}

/* =====================================================
   RENDER
===================================================== */

function render(){

  ctx.save();

  if(game.cameraShake>0){

    ctx.translate(
      (Math.random()-.5)*game.cameraShake,
      (Math.random()-.5)*game.cameraShake
    );
  }

  drawSky();
  drawMountains();
  drawCity();
  drawRoad();
  drawLights();
  drawRivals();
  drawPlayer();
  drawSpeedLines();

  ctx.restore();

  if(game.paused&&game.running){
    pauseOverlay();
  }
}

/* ================= SKY ================= */

function drawSky(){

  const g=ctx.createLinearGradient(0,0,0,H*.55);

  g.addColorStop(0,"#010207");
  g.addColorStop(.35,"#061326");
  g.addColorStop(.7,"#102941");
  g.addColorStop(1,"#1d3448");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  /* stars */

  for(let i=0;i<100;i++){

    const x=(i*137%1000)/1000*W;
    const y=(i*73%420)/420*H*.4;

    ctx.fillStyle=
      i%7===0?"#00eaff":"#fff";

    ctx.globalAlpha=.25+(i%5)*.1;

    ctx.fillRect(x,y,1.5,1.5);
  }

  ctx.globalAlpha=1;

  /* moon */

  ctx.beginPath();

  ctx.arc(
    W*.78,
    H*.16,
    Math.min(W,H)*.06,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#dceeff";
  ctx.shadowBlur=45;
  ctx.shadowColor="#52baff";
  ctx.fill();
  ctx.shadowBlur=0;

  /* moon dark spot */

  ctx.beginPath();

  ctx.arc(
    W*.80,
    H*.145,
    Math.min(W,H)*.047,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#cbddec";
  ctx.fill();
}

/* ================= MOUNTAINS ================= */

function drawMountains(){

  const horizon=H*.43;

  ctx.fillStyle="#07101b";

  ctx.beginPath();
  ctx.moveTo(0,horizon);

  for(let i=0;i<=12;i++){

    const x=i/12*W;
    const y=
      horizon-
      (30+((i*83)%90));

    ctx.lineTo(x,y);
  }

  ctx.lineTo(W,horizon);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="#0a1824";

  ctx.beginPath();
  ctx.moveTo(0,horizon);

  for(let i=0;i<=18;i++){

    const x=i/18*W;
    const y=
      horizon-
      (20+((i*41)%55));

    ctx.lineTo(x,y);
  }

  ctx.lineTo(W,horizon);
  ctx.closePath();
  ctx.fill();
}

/* ================= CITY ================= */

function drawCity(){

  const horizon=H*.435;

  for(let i=0;i<65;i++){

    const bw=10+((i*19)%42);
    const bh=20+((i*47)%125);
    const x=(i/65)*W;

    ctx.fillStyle=
      i%3===0?"#07131f":"#09101a";

    ctx.fillRect(
      x,
      horizon-bh,
      bw,
      bh
    );

    /* windows */

    for(let r=0;r<4;r++){

      if((i+r)%3===0){

        ctx.fillStyle=
          i%5===0?
          "rgba(0,234,255,.7)":
          "rgba(255,190,70,.45)";

        ctx.fillRect(
          x+4,
          horizon-bh+10+r*15,
          3,
          5
        );
      }
    }
  }

  /* horizon glow */

  const glow=ctx.createLinearGradient(
    0,horizon-50,
    0,horizon+30
  );

  glow.addColorStop(0,"rgba(0,234,255,0)");
  glow.addColorStop(.5,"rgba(0,160,255,.18)");
  glow.addColorStop(1,"rgba(0,234,255,0)");

  ctx.fillStyle=glow;
  ctx.fillRect(0,horizon-50,W,80);
}

/* ================= ROAD ================= */

function roadCenter(y){

  const horizon=H*.435;

  let p=(y-horizon)/(H-horizon);

  p=Math.max(0,Math.min(1,p));

  const c1=
    Math.sin(
      game.distance*.0011+
      p*5.5
    )*.13;

  const c2=
    Math.sin(
      game.distance*.00055+
      p*2.2
    )*.07;

  return W/2+(c1+c2)*W*p*p+
    game.x*W*.04*p;
}

function drawRoad(){

  const horizon=H*.435;
  const slices=95;

  ctx.fillStyle="#142018";
  ctx.fillRect(0,horizon,W,H);

  for(let i=0;i<slices;i++){

    const p1=i/slices;
    const p2=(i+1)/slices;

    const y1=
      horizon+
      Math.pow(p1,1.72)*(H-horizon);

    const y2=
      horizon+
      Math.pow(p2,1.72)*(H-horizon);

    const c1=roadCenter(y1);
    const c2=roadCenter(y2);

    const rw1=
      35+
      Math.pow(p1,1.72)*W*.90;

    const rw2=
      35+
      Math.pow(p2,1.72)*W*.90;

    /* grass */

    ctx.fillStyle=
      i%2?
      "#111b15":
      "#172119";

    ctx.fillRect(0,y1,W,y2-y1+2);

    /* asphalt */

    ctx.beginPath();

    ctx.moveTo(c1-rw1/2,y1);
    ctx.lineTo(c1+rw1/2,y1);
    ctx.lineTo(c2+rw2/2,y2);
    ctx.lineTo(c2-rw2/2,y2);
    ctx.closePath();

    ctx.fillStyle=
      i%2?"#25292e":"#292d32";

    ctx.fill();

    /* road texture */

    if(i%3===0){

      ctx.strokeStyle="rgba(255,255,255,.035)";
      ctx.lineWidth=1;

      ctx.beginPath();
      ctx.moveTo(c1-rw1*.2,y1);
      ctx.lineTo(c2-rw2*.2,y2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(c1+rw1*.2,y1);
      ctx.lineTo(c2+rw2*.2,y2);
      ctx.stroke();
    }

    /* center dashed line */

    if(
      (i+Math.floor(game.distance*.018))%8<4
    ){

      ctx.strokeStyle=
        "rgba(255,255,255,.68)";

      ctx.lineWidth=
        1+p1*4;

      ctx.beginPath();
      ctx.moveTo(c1,y1);
      ctx.lineTo(c2,y2);
      ctx.stroke();
    }

    /* edge lines */

    ctx.strokeStyle=
      i%5<2?"#fff":"#00dfff";

    ctx.lineWidth=
      1+p1*4;

    ctx.beginPath();
    ctx.moveTo(c1-rw1/2,y1);
    ctx.lineTo(c2-rw2/2,y2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(c1+rw1/2,y1);
    ctx.lineTo(c2+rw2/2,y2);
    ctx.stroke();
  }
}

/* ================= STREET LIGHTS ================= */

function drawLights(){

  const horizon=H*.435;

  for(let i=0;i<32;i++){

    let p=
      ((i/32)+game.distance*.00022)%1;

    const y=
      horizon+
      Math.pow(p,1.8)*(H-horizon);

    const center=roadCenter(y);

    const roadWidth=
      35+
      Math.pow(p,1.72)*W*.90;

    const side=i%2?-1:1;

    const x=
      center+
      side*(roadWidth/2+20+p*80);

    const h=20+p*95;

    ctx.strokeStyle=
      "rgba(160,180,195,.7)";

    ctx.lineWidth=
      1+p*3;

    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x,y-h);
    ctx.stroke();

    ctx.strokeStyle="#00eaff";
    ctx.lineWidth=Math.max(1,p*3);

    ctx.beginPath();
    ctx.moveTo(x,y-h);
    ctx.lineTo(
      x-side*(5+p*15),
      y-h
    );
    ctx.stroke();

    ctx.fillStyle="#dfffff";
    ctx.shadowBlur=18;
    ctx.shadowColor="#00eaff";

    ctx.beginPath();
    ctx.arc(
      x-side*(5+p*15),
      y-h,
      2+p*5,
      0,
      Math.PI*2
    );
    ctx.fill();

    ctx.shadowBlur=0;
  }
}

/* ================= RIVALS ================= */

function drawRivals(){

  const horizon=H*.435;
  const trackLength=game.laps*3500;

  for(let i=1;i<cars.length;i++){

    let rel=cars[i].z-game.distance;

    if(rel<0){
      rel+=trackLength;
    }

    if(rel<25||rel>1700)continue;

    const p=1-rel/1700;

    const y=
      horizon+
      Math.pow(p,1.7)*(H-horizon);

    const center=roadCenter(y);

    const roadWidth=
      35+
      Math.pow(p,1.72)*W*.90;

    const x=
      center+
      cars[i].x*roadWidth*.40;

    const size=8+p*42;

    drawCar(
      x,
      y-size*.45,
      size,
      cars[i].color,
      false
    );
  }
}

/* ================= CAR ================= */

function drawCar(x,y,size,color,player){

  const w=size;
  const h=size*.58;

  ctx.save();
  ctx.translate(x,y);

  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.65)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    h*.48,
    w*.65,
    h*.18,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* wheels */

  ctx.fillStyle="#030303";

  ctx.fillRect(
    -w*.52,
    h*.02,
    w*.14,
    h*.38
  );

  ctx.fillRect(
    w*.38,
    h*.02,
    w*.14,
    h*.38
  );

  /* body */

  const body=ctx.createLinearGradient(
    -w*.5,
    0,
    w*.5,
    0
  );

  body.addColorStop(0,"#080808");
  body.addColorStop(.18,color);
  body.addColorStop(.45,"#fff");
  body.addColorStop(.55,color);
  body.addColorStop(.82,color);
  body.addColorStop(1,"#080808");

  ctx.fillStyle=body;

  ctx.beginPath();

  ctx.moveTo(-w*.48,h*.30);
  ctx.lineTo(-w*.41,-h*.02);
  ctx.lineTo(-w*.25,-h*.40);
  ctx.lineTo(w*.25,-h*.40);
  ctx.lineTo(w*.41,-h*.02);
  ctx.lineTo(w*.48,h*.30);
  ctx.lineTo(w*.35,h*.43);
  ctx.lineTo(-w*.35,h*.43);
  ctx.closePath();

  ctx.fill();

  /* hood */

  ctx.fillStyle="rgba(255,255,255,.18)";

  ctx.beginPath();

  ctx.moveTo(-w*.30,-h*.02);
  ctx.lineTo(w*.30,-h*.02);
  ctx.lineTo(w*.22,h*.20);
  ctx.lineTo(-w*.22,h*.20);
  ctx.closePath();

  ctx.fill();

  /* windshield */

  ctx.fillStyle="#07141c";

  ctx.beginPath();

  ctx.moveTo(-w*.20,-h*.34);
  ctx.lineTo(w*.20,-h*.34);
  ctx.lineTo(w*.29,-h*.05);
  ctx.lineTo(-w*.29,-h*.05);
  ctx.closePath();

  ctx.fill();

  ctx.strokeStyle="rgba(255,255,255,.45)";
  ctx.lineWidth=Math.max(1,w*.02);
  ctx.stroke();

  /* headlights */

  ctx.fillStyle=
    player?"#eaffff":"#ff3045";

  ctx.shadowBlur=16;
  ctx.shadowColor=
    player?"#00eaff":"#ff203d";

  ctx.fillRect(
    -w*.38,
    h*.15,
    w*.13,
    h*.075
  );

  ctx.fillRect(
    w*.25,
    h*.15,
    w*.13,
    h*.075
  );

  ctx.shadowBlur=0;

  /* spoiler */

  ctx.fillStyle="#0a0a0a";

  ctx.fillRect(
    -w*.40,
    -h*.02,
    w*.80,
    h*.055
  );

  /* side neon */

  if(player){

    ctx.strokeStyle="#00eaff";
    ctx.shadowBlur=10;
    ctx.shadowColor="#00eaff";
    ctx.lineWidth=Math.max(1,w*.025);

    ctx.beginPath();
    ctx.moveTo(-w*.39,h*.28);
    ctx.lineTo(-w*.28,h*.38);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(w*.39,h*.28);
    ctx.lineTo(w*.28,h*.38);
    ctx.stroke();

    ctx.shadowBlur=0;
  }

  /* nitro flame */

  if(player&&game.boosting){

    for(let i=-1;i<=1;i++){

      ctx.fillStyle=
        i===0?"#fff":"#00eaff";

      ctx.shadowBlur=25;
      ctx.shadowColor="#00eaff";

      ctx.beginPath();

      ctx.moveTo(
        i*w*.11,
        h*.40
      );

      ctx.lineTo(
        i*w*.16,
        h*.40+
        18+
        Math.random()*25
      );

      ctx.lineTo(
        i*w*.035,
        h*.40
      );

      ctx.closePath();
      ctx.fill();
    }

    ctx.shadowBlur=0;
  }

  ctx.restore();
}

/* ================= PLAYER ================= */

function drawPlayer(){

  const x=
    W/2+
    game.x*W*.30;

  const y=H*.82;

  const size=Math.min(W,H)*.215;

  drawCar(
    x,
    y,
    size,
    "#00eaff",
    true
  );
}

/* ================= SPEED EFFECT ================= */

function drawSpeedLines(){

  if(game.speed<165)return;

  const power=
    Math.min(1,(game.speed-165)/120);

  ctx.globalAlpha=.12+power*.3;

  for(let i=0;i<42;i++){

    const x=Math.random()*W;
    const y=Math.random()*H*.78;

    const len=
      15+
      Math.random()*90*power;

    ctx.strokeStyle=
      i%2?"#fff":"#00eaff";

    ctx.lineWidth=
      1+Math.random()*2;

    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x,y+len);
    ctx.stroke();
  }

  ctx.globalAlpha=1;
}

/* ================= PAUSE ================= */

function pauseOverlay(){

  ctx.fillStyle="rgba(0,0,0,.55)";
  ctx.fillRect(0,0,W,H);

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.font=
    "1000 "+Math.min(85,W*.14)+"px Arial";

  ctx.fillStyle="#fff";
  ctx.shadowBlur=25;
  ctx.shadowColor="#00eaff";

  ctx.fillText(
    "PAUSED",
    W/2,
    H/2
  );

  ctx.shadowBlur=0;

  ctx.font="900 13px Arial";
  ctx.fillStyle="#00eaff";

  ctx.fillText(
    "PRESS P / ESC TO RESUME",
    W/2,
    H/2+70
  );
}

/* ================= LOOP ================= */

let last=performance.now();

function loop(now){

  let dt=(now-last)/1000;

  if(!Number.isFinite(dt)||dt>.1){
    dt=.016;
  }

  last=now;

  update(dt);
  render();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* ================= BOOT ================= */

setTimeout(()=>{

  const boot=document.getElementById("boot");

  boot.style.opacity="0";

  setTimeout(()=>{
    boot.style.display="none";
    document.getElementById("menu").style.display="flex";
  },700);

},1900);

</script>
